[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androidmirror"
version = "0.1.0"
description = "Android Mirror: a contextual generation engine built on a knowledge graph and a causal DAG"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "networkx>=3.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
androidmirror = "androidmirror.cli:main"

[tool.setuptools]
packages = {find = {include = ["androidmirror*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
